---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: {{ NFS_SERVER }}
  share: {{ NFS_SHARE }}
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - proto=tcp
  - sec=sys
  - hard
  - timeo=600
  - retrans=3
  - rsize=1048576
  - wsize=1048576
